services:
  - type: web
    name: fastapi-service
    env: python
    buildCommand: "poetry install --only main --no-root --no-interaction"
    startCommand: "poetry run uvicorn app.main:app --host 0.0.0.0 --port 10000"
    plan: free
    envVars:
      # Keep in sync with the Poetry version used to write poetry.lock
      - key: POETRY_VERSION
        value: "2.2.1"
