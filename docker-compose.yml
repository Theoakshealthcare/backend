services:
  api:
    build: .
    container_name: oaklycare_api
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app:ro  # Read-only for app code
      - ./alembic.ini:/app/alembic.ini:ro  # Read-only for alembic config
    env_file:
      - .env
    environment:
      # Database Configuration
      - DATABASE_URL=postgresql://postgres.ljrcyoonkqpbdsddqmwk:Oaklycarehealth@aws-0-eu-north-1.pooler.supabase.com:6543/postgres
      - POSTGRES_SERVER=aws-0-eu-north-1.pooler.supabase.com
      - POSTGRES_USER=postgres.ljrcyoonkqpbdsddqmwk
      - POSTGRES_PASSWORD=Oaklycarehealth
      - POSTGRES_DB=postgres
      
      # Security
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-here}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      
      # Email Configuration
      - SMTP_TLS=True
      - SMTP_PORT=465
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - EMAILS_FROM_EMAIL=${EMAILS_FROM_EMAIL}

      # Gemini AI Configuration
      - GEMINI_API_KEY=${GEMINI_API_KEY}

      # Encryption Key
      - VITALS_ENCRYPTION_KEY=${VITALS_ENCRYPTION_KEY}
      
      # Application Configuration
      - PROJECT_NAME=Oaklycare
      - OTP_EXPIRE_MINUTES=15
      - EMAIL_RESET_TOKEN_EXPIRE_HOURS=24
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - BACKEND_CORS_ORIGINS=["http://localhost:3000", "http://localhost:8000", "https://backend-y5r0.onrender.com"]
      
      # API Configuration
      - API_V1_STR=/api/v1
      
      # Server Configuration
      - HOST=0.0.0.0
      - PORT=8000
    networks:
      - oaklycare-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "https://backend-y5r0.onrender.com/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # db:
  #   image: postgres:15-alpine
  #   container_name: oaklycare_db
  #   environment:
  #     - POSTGRES_USER=postgres
  #     - POSTGRES_PASSWORD=postgres
