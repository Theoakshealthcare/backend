# Local development stack: API + Postgres.
#   cp .env.example .env   # then fill in values
#   docker compose up --build
# All configuration comes from .env. No secrets live in this file.
services:
  api:
    build: .
    env_file: ${OAKLY_ENV_FILE_PATH:-.env}
    environment:
      # Talk to the local db service unless .env overrides it.
      DATABASE_URL: ${DATABASE_URL:-postgresql://oakly:oakly@db:5432/oakly}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app:ro
      - private_uploads:/app/private_uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: oakly
      POSTGRES_PASSWORD: oakly  # local development only
      POSTGRES_DB: oakly
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oakly -d oakly"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  private_uploads:
