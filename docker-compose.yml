# Local development stack: API + ARQ worker + Postgres + Redis.
#   cp .env.example .env   # then fill in values
#   docker compose up --build
# All configuration comes from .env. No secrets live in this file.
services:
  api:
    build: .
    env_file: ${OAKLY_ENV_FILE_PATH:-.env}
    environment:
      # Talk to the local db service unless .env overrides it.
      DATABASE_URL: ${DATABASE_URL:-postgresql://oakly:oakly@db:5432/oakly}
      # The WhatsApp webhook enqueues inbound messages for the worker, so the API needs Redis too.
      REDIS_URL: redis://:${REDIS_PASSWORD:-oakly-dev-redis}@redis:6379/0
      ENVIRONMENT: ${ENVIRONMENT:-development}
    # Lets the containers reach a fake Meta server on the host (scripts/whatsapp_local_e2e.py).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./app:/app/app:ro
      - private_uploads:/app/private_uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Scheduled jobs (unpaid-booking expiry, caregiver dispatch waves). Same image as the API; the
  # API container runs the migrations, so wait for it to be healthy.
  worker:
    build: .
    command: ["arq", "app.worker.WorkerSettings"]
    env_file: ${OAKLY_ENV_FILE_PATH:-.env}
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://oakly:oakly@db:5432/oakly}
      REDIS_URL: redis://:${REDIS_PASSWORD:-oakly-dev-redis}@redis:6379/0
      ENVIRONMENT: ${ENVIRONMENT:-development}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./app:/app/app:ro
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    # Password-protected and bound to loopback only: never expose Redis on the network.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-oakly-dev-redis}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:-oakly-dev-redis}
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: oakly
      POSTGRES_PASSWORD: oakly  # local development only
      POSTGRES_DB: oakly
    ports:
      - "127.0.0.1:5432:5432"  # loopback only
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oakly -d oakly"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  private_uploads:
