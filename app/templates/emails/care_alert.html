<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>{{ project_name|e }} - {{ heading|e }}</title>
</head>
<body style="background-color: #f5f5f5; font-family: sans-serif; font-size: 14px; line-height: 1.4; margin: 0; padding: 0;">
    <table role="presentation" width="100%" style="background-color: #f5f5f5;">
        <tr>
            <td style="padding: 24px;">
                <table role="presentation" width="100%" style="max-width: 580px; margin: 0 auto; background: #ffffff; border-radius: 3px;">
                    <tr>
                        <td style="padding: 24px; color: #333333;">
                            <h2 style="color: {% if critical %}#b3261e{% else %}#168283{% endif %}; margin-top: 0;">{{ heading|e }}</h2>
                            <p>{{ message|e }}</p>
                            <p style="color: #757575;">You are getting this because the person you care for chose to share their care updates with you. The {{ project_name|e }} team</p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
