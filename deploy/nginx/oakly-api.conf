# STEP 2 of 2: the Oakly API server block (Ubuntu: /etc/nginx/sites-available/oakly-api, symlinked into sites-enabled).
# Replace __API_DOMAIN__ with api.<domain> (sed in docs/deploy/staging.md, section 6). Needs the certificate from
# certbot at /etc/letsencrypt/live/__API_DOMAIN__/ (issued with the bootstrap file first).
#
# nginx terminates TLS and proxies to the API container, which listens on 127.0.0.1:8000 only. The compose network
# subnet (172.29.0.0/24) is what the app lists in TRUSTED_PROXIES: nginx reaches the container through its bridge
# gateway, so the app believes the X-Forwarded-For header set below.

# Edge rate limit per client IP. Deliberately generous: Nigerian mobile carriers put many phones behind one public
# IP (CGNAT), so a tight limit would throttle real users. The app has its own login and reset limits.
limit_req_zone $binary_remote_addr zone=oakly_api:10m rate=30r/s;

upstream oakly_api {
    server 127.0.0.1:8000;
    keepalive 16;
}

# Anything that reaches port 80 for another name (or an IP) gets nothing; this host serves one site.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

# Same for HTTPS: refuse the handshake rather than present our certificate to a scanner (nginx 1.19.4+).
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

# HTTP: the ACME challenge, then everything to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name __API_DOMAIN__;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # `http2` on the listen line works on Ubuntu 24.04's nginx 1.24 (the separate `http2 on;` needs 1.25.1+); newer
    # nginx only logs a deprecation warning for it.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __API_DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__API_DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__API_DOMAIN__/privkey.pem;

    # Mozilla "intermediate" profile. (Let's Encrypt no longer issues OCSP responses, so no stapling.)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:oakly_tls:10m;
    ssl_session_tickets off;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=86400" always;  # raise to a year once staging is stable
    add_header X-Content-Type-Options "nosniff" always;

    # Voice notes cap at 12 MB (VOICE_NOTE_MAX_BYTES) and caregiver documents are photos: 16 MB covers both.
    client_max_body_size 16m;

    gzip on;
    gzip_types application/json text/plain text/css application/javascript;
    gzip_min_length 1024;

    # Health probe for the smoke script and any uptime monitor: no access-log noise.
    location = /health {
        access_log off;
        proxy_pass http://oakly_api;
    }

    location / {
        limit_req zone=oakly_api burst=90 nodelay;

        proxy_pass http://oakly_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Set, not appended: the app takes the right-most hop that is not a trusted proxy as the client, and a
        # client-supplied X-Forwarded-For must not be passed through.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # gunicorn's own timeout is 120 s (boot/docker-run.sh); stay just above it so the app answers first.
        proxy_connect_timeout 5s;
        proxy_read_timeout 130s;
        proxy_send_timeout 130s;
    }
}
