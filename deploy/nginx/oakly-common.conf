# STEP 0: shared by both sites, installed ONCE (Ubuntu: /etc/nginx/conf.d/oakly-common.conf).
# Anything that reaches port 80 or 443 for another name (or a bare IP) gets nothing; this host serves exactly the two
# Oakly API names (staging and production), each in its own server block (oakly-api.conf, used twice).

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

# Same for HTTPS: refuse the handshake rather than present our certificate to a scanner (nginx 1.19.4+).
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}
