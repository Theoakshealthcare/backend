# STEP 1 of 2: HTTP only, used once to get the first Let's Encrypt certificate (webroot challenge).
# Replace __API_DOMAIN__ (sed in docs/deploy/staging.md, section 6), install, `nginx -t && systemctl reload nginx`,
# run certbot, then switch to oakly-api.conf (the real server block).
server {
    listen 80;
    listen [::]:80;
    server_name __API_DOMAIN__;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 404;
    }
}
