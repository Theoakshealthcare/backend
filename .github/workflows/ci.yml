name: CI

# What runs when (see docs/deployment/BRANCHING.md):
#
#   | event               | CI runs                                          |
#   |---------------------|--------------------------------------------------|
#   | PR -> develop       | everything (docs-only PRs skip code)             |
#   | PR -> develop draft | nothing (mark ready to run CI)                   |
#   | push to develop     | lint, tests, security (safety net)               |
#   | push to main        | nothing                                          |
#
# `main` is deliberately absent. Promotion to main is a fast-forward of develop,
# so the commit that lands on main is byte-identical to one that already passed
# here, and whose image was already built and tested by cd-staging.yml.
# Re-running CI on main would test the same tree again for no new information.
#
# The release image is NOT built here. CI only proves the Dockerfile builds and
# is free of HIGH/CRITICAL CVEs (PR only, nothing is pushed). cd-staging.yml is
# the only workflow that publishes an image.
#
# Oakly specifics kept from the pre-template CI: the bug-class ruff rules, the
# import/OpenAPI smoke test, the eight FE-guide `--check` runs, and the test
# suite on testcontainers (it starts its own throwaway Postgres, so there is no
# `services:` block). The suite takes about 55 minutes on one runner, so it is
# split into shards that run side by side.

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
    # `ready_for_review` is needed so a draft PR runs CI when it is marked ready.
    types: [opened, reopened, ready_for_review, synchronize]

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  # Cancel superseded PR runs. Never cancel a push to develop: that run is the
  # only safety net a direct push gets.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  POETRY_VERSION: "2.2.1"
  # Dummy values so the app can import; the static checks never connect to a database,
  # and the tests get their own throwaway Postgres from testcontainers.
  DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
  SECRET_KEY: ci-secret-key
  VITALS_ENCRYPTION_KEY: 50X3wQnra4NZogcYofLdQonUIBEcDbj2Pf_lCgblQVI=  # throwaway CI-only key

jobs:
  changes:
    name: Classify changes
    # Draft PRs run nothing.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - name: Is this more than a docs-only change?
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # previous_filename is included so renaming a code file into docs/
          # (or to .md) still counts as a code change.
          gh api --paginate "repos/$REPO/pulls/$PR/files" -q '.[] | .filename, (.previous_filename // empty)' > changed.txt
          # Docs-only = every changed file is under docs/ or is a markdown file.
          # The FE guides live under docs/ too, but their `--check` is cheap to
          # skip: a guide edit without its captures is caught on the next code PR.
          if grep -qvE '^docs/|\.md$' changed.txt; then CODE=true; else CODE=false; fi
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

  lint:
    name: Lint and static checks
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version

      - uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1
        with:
          version: ${{ env.POETRY_VERSION }}
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache virtualenv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}

      - name: Validate pyproject and lock file
        run: poetry check --lock

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Lint (bug-class rules)
        # Only syntax errors and undefined names fail CI for now; the full
        # ruleset (and ruff format) is enforced once the codebase is cleaned up.
        run: poetry run ruff check --select E9,F63,F7,F82 .

      - name: App import and OpenAPI smoke test
        run: poetry run python -m scripts.ci_smoke

      - name: FE integration guides match their captures
        run: |
          poetry run python -m scripts.render_fe_guide docs/fe-integration-guide-caregiver.md docs/fe-captures/caregiver --check
          poetry run python -m scripts.render_fe_guide docs/fe-integration-guide-admin.md docs/fe-captures/admin --check
          poetry run python -m scripts.render_fe_guide docs/fe-integration-guide-patient-profile-vitals.md docs/fe-captures/patient-profile-vitals --check
          poetry run python -m scripts.render_fe_guide docs/fe-integration-guide-patient-notifications.md docs/fe-captures/patient-notifications --check
          poetry run python -m scripts.render_fe_guide docs/fe-integration-guide-patient-bookings.md docs/fe-captures/patient --check
          poetry run python -m scripts.render_fe_guide docs/fe-integration-guide-password-reset.md docs/fe-captures/password-reset --check
          poetry run python -m scripts.render_fe_guide docs/fe-integration-guide-patient-fallguard.md docs/fe-captures/patient-fallguard --check
          poetry run python -m scripts.render_fe_guide docs/fe-integration-guide-caregiver-ai-notes.md docs/fe-captures/caregiver-ai-notes --check
          poetry run python -m scripts.render_fe_guide docs/fe-integration-guide-chat-push-payment-return.md docs/fe-captures/chat-push-payment-return --check

  test:
    name: Tests (shard ${{ matrix.group }}/4)
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      # One failing shard must not hide the others: a red run should show every failure at once.
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version

      - uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1
        with:
          version: ${{ env.POETRY_VERSION }}
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache virtualenv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}

      - run: poetry install --no-interaction --no-root

      # pytest-split divides the collected tests into 4 groups. With no .test_durations file it balances by test
      # count; a committed durations file (see docs/deployment/CICD_PIPELINE.md) balances by time.
      - name: Tests (throwaway Postgres via testcontainers)
        run: poetry run pytest -q -p no:warnings --splits 4 --group ${{ matrix.group }} --durations=25 --store-durations

      # How long each test took on this runner. The four files are merged into the committed .test_durations
      # (scripts/merge_test_durations.py) so the next run balances the shards by time.
      - name: Keep the measured test durations
        if: always()
        run: cp .test_durations durations-${{ matrix.group }}.json || true

      - name: Upload the measured test durations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-durations-${{ matrix.group }}
          path: durations-${{ matrix.group }}.json
          if-no-files-found: ignore
          retention-days: 14

  security:
    name: Security (Semgrep)
    needs: [changes]
    # Runs even on docs-only PRs: a pasted secret or a bad snippet lands in docs too.
    if: needs.changes.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - run: pipx install semgrep

      - name: Run security scan
        run: |
          if [ -x ./scripts/security-scan.sh ]; then
            ./scripts/security-scan.sh
          else
            echo "scripts/security-scan.sh not present; skipping Semgrep."
          fi

  image-check:
    name: Image builds and has no HIGH/CRITICAL CVEs
    # PRs only. A push to develop is followed by cd-staging.yml, which builds
    # the real image and fails before deploying if the build is broken.
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    needs: [changes, lint, test, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (local only, not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: oakly-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Scans the finished image, so it sees OS packages too. CVEs with no
      # released fix are ignored (nothing can be upgraded); list accepted
      # exceptions in a .trivyignore file at the repo root.
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: oakly-api:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  # The one check that always reports. Jobs above are legitimately skipped on a
  # docs-only PR, and a skipped required check would block the merge. Require
  # THIS check in branch protection, not the individual jobs.
  ci-gate:
    name: CI gate
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    needs: [changes, lint, test, security, image-check]
    runs-on: ubuntu-latest
    steps:
      - name: Every job that ran must have passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          BAD=$(echo "$RESULTS" | jq -r '[to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key] | join(", ")')
          if [ -n "$BAD" ]; then
            echo "::error::failed or cancelled: $BAD"
            exit 1
          fi
